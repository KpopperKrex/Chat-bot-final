name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip -o LifePals-1.4.1-source.zip -d LifePals
      - run: mvn -B package -f LifePals/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: LifePals-jar
          path: LifePals/target/LifePals.jar
